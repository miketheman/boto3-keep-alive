[project]
name = "boto3-keep-alive"
version = "0.1.0"
description = "Lambda function demonstrating boto3 TCP keep-alive with DynamoDB"
authors = [{name = "Mike Fiedler", email = "miketheman@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.42.29",
    "botocore>=1.42.29",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
]
loadtest = [
    "requests",
]
charts = [
    "matplotlib",
    "pandas",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
